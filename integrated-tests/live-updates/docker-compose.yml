services:
  node1:
    image: localhost/iron-carrier
    build: ../../
    networks:
      - sync-net
    tmpfs:
      - /data
    volumes:
      - ../plain-config.toml:/config/config.toml:ro
      - ../../scripts/gen-test-files.sh:/scripts/gen-test-files.sh:ro
    entrypoint: sh -c '/scripts/gen-test-files.sh node1 /data && iron-carrier -vvd /config/config.toml'

  node2:
    image: localhost/iron-carrier
    build: ../../
    networks:
      - sync-net
    tmpfs:
      - /data
    volumes:
      - ../plain-config.toml:/config/config.toml:ro
      - ../../scripts/gen-test-files.sh:/scripts/gen-test-files.sh:ro
    entrypoint: sh -c "/scripts/gen-test-files.sh node2 /data && iron-carrier -vvd /config/config.toml"

  node3:
    image: localhost/iron-carrier
    build: ../../
    networks:
      - sync-net
    tmpfs:
      - /data
    volumes:
      - ../plain-config.toml:/config/config.toml:ro
      - ../../scripts/gen-test-files.sh:/scripts/gen-test-files.sh:ro
      - ../../scripts/live-file-ops.sh:/scripts/live-file-ops.sh:ro
    entrypoint: sh -c '/scripts/gen-test-files.sh node3 /data && iron-carrier -vvd /config/config.toml & sleep 5 && /scripts/live-file-ops.sh /data 10 updates && sleep 8 && echo "test completed" && sleep infinity'

networks:
  sync-net:
    driver: bridge
